name: Deployment Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  deploy-safety-checks:
    name: Build + Diagnostico (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Content/routing diagnostics
        run: node scripts/diagnostico.cjs
